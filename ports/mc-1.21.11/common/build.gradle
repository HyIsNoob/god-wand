plugins {
    id 'net.fabricmc.fabric-loom-remap'
}
ext.sharedRepoRoot = file('../../..')
ext.sharedProfile = 'mc-1.21.11'
apply from: new File(sharedRepoRoot, 'gradle/shared-sources.gradle')


dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    compileOnly "net.fabricmc:fabric-loader:${project.loader_version}"
    compileOnly "org.spongepowered:mixin:0.8.7"

    testImplementation "org.lwjgl:lwjgl-shaderc:3.3.3"
    testRuntimeOnly "org.lwjgl:lwjgl-shaderc:3.3.3:natives-windows"
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "org.ow2.asm:asm:9.7"
    testImplementation "org.ow2.asm:asm-tree:9.7"
    testImplementation "org.mockito:mockito-core:5.14.2"
}

loom {
    accessWidenerPath = new File(sharedSourcesDir, 'resources/godwand.accesswidener')
}

test {
    useJUnitPlatform()
    systemProperty 'net.bytebuddy.experimental', 'true'
    jvmArgs '--sun-misc-unsafe-memory-access=allow', '-Dnet.bytebuddy.experimental=true'
}

// Native target inspection uses the stable Java 25 classfile API; shipped classes stay Java 21.
tasks.named('compileTestJava', JavaCompile) {
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }
    options.release = 25
}
test { javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) } }

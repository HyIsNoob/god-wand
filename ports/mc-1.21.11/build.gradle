plugins {
    id 'base'
    id 'net.fabricmc.fabric-loom-remap' version '1.19.3' apply false
}

def sharedVersion = new Properties()
file('../../gradle.properties').withInputStream { sharedVersion.load(it) }
allprojects { ext.mod_version = sharedVersion.getProperty('mod_version') }

version = project.mod_version
group = project.maven_group

subprojects {
    apply plugin: 'java'
    java {
        toolchain { languageVersion = JavaLanguageVersion.of(21) }
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
        options.compilerArgs += ['-Xmaxerrs','2000']
    }
    tasks.withType(Jar).configureEach {
        from(rootProject.file('../../LICENSE'))
    }
    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

tasks.named('build') {
    dependsOn ':common:build', ':fabric:build', ':neoforge:build'
}

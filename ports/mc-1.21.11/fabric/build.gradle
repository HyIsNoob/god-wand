plugins {
    id 'net.fabricmc.fabric-loom-remap'
}

version = project.mod_version
group = project.maven_group
base {
    archivesName = "godwand-fabric-1.21.11"
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation project(path: ':common', configuration: 'namedElements')

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

loom {
    accessWidenerPath = new File(project(':common').sharedSourcesDir, 'resources/godwand.accesswidener')
}

processResources {
    from project(':common').sourceSets.main.resources
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    source project(':common').sourceSets.main.allSource
}

tasks.withType(Jar).configureEach {
    exclude 'com/terraformersmc/**'
}

test {
    useJUnitPlatform()
}

// Shared generated inputs must precede every loader task that consumes them.
tasks.withType(JavaCompile).configureEach { dependsOn ':common:generateSharedSources' }
tasks.named('processResources') { dependsOn ':common:generateSharedSources' }

tasks.matching { it.name in ['validateAccessWidener', 'sourcesJar', 'javadoc'] }.configureEach { dependsOn ':common:generateSharedSources' }

// Native target inspection uses the stable Java 25 classfile API; shipped classes stay Java 21.
tasks.named('compileTestJava', JavaCompile) {
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }
    options.release = 25
}
test { javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) } }

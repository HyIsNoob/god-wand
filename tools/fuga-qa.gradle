allprojects {
    plugins.withId('fabric-loom') {
        if(project.name=='fabric') loom.runs.named('client') { runDir '../build/fuga-qa/run' }
    }
    plugins.withId('java') {
        tasks.register('writeFugaQaClasspath') {
            doLast { rootProject.file('build/fuga-qa/classpath.txt').text=sourceSets.main.runtimeClasspath.asPath }
        }
    }
}
gradle.projectsEvaluated {
    def p=gradle.rootProject
    def qaWorld=p.findProperty('fugaQaWorld') ?: 'Fuga QA'
    p.project(':fabric').tasks.named('runClient') {
        workingDir p.file('build/fuga-qa/run')
        jvmArgs '-Dgodwand.fuga.qa=true', '-Dfabric.addMods='+p.file('build/fuga-qa/probe.jar').absolutePath
        args '--quickPlaySingleplayer',qaWorld,'--width','1280','--height','720'
        jvmArgs '-Dgodwand.fuga.poseOnly='+(p.findProperty('fugaPoseOnly') ?: 'false')
        jvmArgs '-Dgodwand.fuga.nocapture='+(p.findProperty('fugaNoCapture') ?: 'false')
        jvmArgs '-Dgodwand.fuga.qa.defer='+(p.findProperty('fugaDefer') ?: 'false')
        maxHeapSize='3G'
    }
}

plugins {
    id 'base'
    id 'fabric-loom' version '1.19-SNAPSHOT' apply false
}

version = project.mod_version
group = project.maven_group

subprojects {
    apply plugin: 'java'
    java {
        toolchain { languageVersion = JavaLanguageVersion.of(25) }
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }
    tasks.withType(Jar).configureEach {
        from(rootProject.file('LICENSE'))
    }
    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        systemProperty 'net.bytebuddy.experimental', 'true'
        jvmArgs '--sun-misc-unsafe-memory-access=allow', '-Dnet.bytebuddy.experimental=true'
    }
    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

tasks.named('build') {
    dependsOn ':common:build', ':fabric:build', ':neoforge:build'
}

[
    'fabric-1.20.1': 'buildFabric1201',
    'forge-1.20.1': 'buildForge1201',
    'ports/mc-26.3': 'buildPort263'
].each { directory, taskName ->
    tasks.register(taskName, Exec) {
        group = 'build'
        description = "Build and check the standalone ${directory} port."
        workingDir layout.projectDirectory.dir(directory)
        def windows = System.getProperty('os.name').toLowerCase().contains('windows')
        def wrapper = windows ? ['cmd', '/c', 'gradlew.bat'] : ['sh', './gradlew']
        commandLine wrapper + ['build', '--console=plain'] + (gradle.startParameter.offline ? ['--offline'] : [])
    }
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Build and check all supported loader/version combinations and ports.'
    dependsOn 'build', 'buildFabric1201', 'buildForge1201', 'buildPort263'
}

tasks.register('releaseJars', Copy) {
    group = 'build'
    description = 'Build all versions and collect installable jars in build/release.'
    dependsOn 'buildAll'
    into layout.buildDirectory.dir(project.version.toString().endsWith('-dev') ? "preview/${project.version}" : 'release')
    ['fabric', 'neoforge', 'fabric-1.20.1', 'forge-1.20.1'].each { loader ->
        from("${loader}/build/libs") { include "godwand-${loader}-${project.mod_version}.jar" }
    }
    from("ports/mc-26.3/fabric/build/libs") {
        include "godwand-fabric-26.3-${project.mod_version}.jar"
        into "26.3"
    }
}

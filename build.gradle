plugins {
    id 'base'
    id 'fabric-loom' version '1.19-SNAPSHOT' apply false
}

apply from: 'gradle/shared-sources.gradle'

version = project.mod_version
group = project.maven_group

subprojects {
    apply plugin: 'java'
    java {
        toolchain { languageVersion = JavaLanguageVersion.of(25) }
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }
    tasks.withType(Jar).configureEach {
        from(rootProject.file('LICENSE'))
    }
    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        systemProperty 'net.bytebuddy.experimental', 'true'
        jvmArgs '--sun-misc-unsafe-memory-access=allow', '-Dnet.bytebuddy.experimental=true'
    }
    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

tasks.named('build') {
    dependsOn ':common:build', ':fabric:build', ':neoforge:build'
}

['fabric-1.20.1': 'buildFabric1201', 'forge-1.20.1': 'buildForge1201'].each { directory, taskName ->
    tasks.register(taskName, Exec) {
        group = 'build'
        description = "Build and check the standalone ${directory} port."
        workingDir layout.projectDirectory.dir(directory)
        def windows = System.getProperty('os.name').toLowerCase().contains('windows')
        def wrapper = windows ? ['cmd', '/c', 'gradlew.bat'] : ['sh', './gradlew']
        commandLine wrapper + ['build', '--console=plain'] + (gradle.startParameter.offline ? ['--offline'] : [])
        doFirst {
            def targetJava = directory == 'forge-1.20.1' ? 17 : 25
            def launcher = project(':common').javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(targetJava) }.get()
            environment 'JAVA_HOME', launcher.metadata.installationPath.asFile.absolutePath
        }
    }
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Build and check all six supported loader/version combinations.'
    dependsOn 'verifySharedSources', 'build', 'buildFabric1201', 'buildForge1201', 'build263'
}

tasks.register('releaseJars', Copy) {
    group = 'build'
    description = 'Build all six versions and collect only installable jars in build/release.'
    dependsOn 'buildAll'
    into layout.buildDirectory.dir(project.version.toString().endsWith('-dev') ? "preview/${project.version}" : 'release')
    ['fabric', 'neoforge'].each { loader ->
        from("ports/mc-26.3/${loader}/build/libs") { include "godwand-${loader}-26.3-${project.mod_version}.jar" }
    }
    ['fabric', 'neoforge', 'fabric-1.20.1', 'forge-1.20.1'].each { loader ->
        from("${loader}/build/libs") { include "godwand-${loader}-${project.mod_version}.jar" }
    }
    inputs.file('CHANGELOG.md')
    doLast {
        def names = ['fabric','neoforge','fabric-1.20.1','forge-1.20.1'].collect { "godwand-${it}-${project.mod_version}.jar" } +
                ['fabric','neoforge'].collect { "godwand-${it}-26.3-${project.mod_version}.jar" }
        File collected = destinationDir
        File versioned = project.version.toString().endsWith('-dev') ? collected : new File(collected, project.version.toString())
        names.each { name ->
            if (!new File(collected,name).isFile()) throw new GradleException("Missing release target: ${name}")
        }
        copy { from names.collect { new File(collected,it) }; into versioned }
        copy { from names.findAll { it.contains('-26.3-') }.collect { new File(collected,it) }; into new File(collected,'26.3') }
        def checksum = { File directory -> names.collect { name ->
            def digest = java.security.MessageDigest.getInstance('SHA-256').digest(new File(directory,name).bytes).encodeHex()
            "${digest}  ${name}"
        }.join('\n') + '\n' }
        new File(versioned,'SHA256SUMS.txt').text = checksum(versioned)
        new File(collected,"SHA256SUMS-${project.mod_version}.txt").text = checksum(collected)
        new File(versioned,'README.txt').text = "God Wand ${project.mod_version} - install ONE JAR for your exact Minecraft version and loader.\n" +
                "All six targets are synchronized from canonical common source plus explicit API adapters.\n" +
                "Includes current boss damage, Atomic terrain/head/render and Singularity/menu updates.\n" +
                "Build/unit checks are not live FPS, shaderpack or multiplayer validation.\n" + names.join('\n') + '\n'
        copy { from rootProject.file('CHANGELOG.md'); into versioned }
    }
}


tasks.register('build263', Exec) {
    group = 'build'
    description = 'Build and test both Minecraft 26.3 loaders with Java 25.'
    workingDir layout.projectDirectory.dir('ports/mc-26.3')
    def wrapper = System.getProperty('os.name').toLowerCase().contains('windows') ? ['cmd', '/c', 'gradlew.bat'] : ['sh', './gradlew']
    commandLine wrapper + ['build', '--console=plain'] + (gradle.startParameter.offline ? ['--offline'] : [])
    doFirst {
        def java25 = project(':common').javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }.get()
        environment 'JAVA_HOME', java25.metadata.installationPath.asFile.absolutePath
    }
}

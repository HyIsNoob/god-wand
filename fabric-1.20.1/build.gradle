plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}
ext.sharedRepoRoot = file('..')
ext.sharedProfile = 'fabric-1.20.1'
apply from: new File(sharedRepoRoot, 'gradle/shared-sources.gradle')


version = project.mod_version
group = project.maven_group

base {
    archivesName = "godwand-fabric-1.20.1"
}

loom {
    accessWidenerPath = new File(sharedSourcesDir, 'resources/godwand.accesswidener')
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    options.encoding = 'UTF-8'
}

tasks.withType(Jar).configureEach {
    from('../LICENSE')
    exclude 'com/terraformersmc/**'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(Test).configureEach {
    failOnNoDiscoveredTests = false
}

tasks.register('verifyAtomic', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.godwand.AtomicPortCheck'
 }
 check.dependsOn verifyAtomic

// Exercise the shared Fuga safety regression against this port's mapped server classes.
tasks.named('compileTestJava') {
    source '../common/src/test/java/net/godwand/skill/FugaSafetyTest.java'
}
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'net.bytebuddy.experimental', 'true'
}

import groovy.json.JsonSlurper
import java.nio.file.Files

// Canonical code/assets are authored once. Adapters contain only explicit per-version differences.
def repo = project.hasProperty('sharedRepoRoot') ? file(project.sharedRepoRoot) : rootDir
ext.sharedRepoRoot = repo
ext.applySharedChanges = { String source, List changes, String label ->
    String result = source
    changes.each { change ->
        String before = change.before, after = change.after
        if (!before || after == null) throw new GradleException("Invalid shared-source adapter: ${label}")
        int at = result.indexOf(before)
        if (at < 0 || result.indexOf(before, at + 1) >= 0)
            throw new GradleException("Shared-source adapter conflict: ${label}. Update this API adapter; stale version code will not be built.")
        result = result.substring(0, at) + after + result.substring(at + before.length())
    }
    result
}
ext.generateSharedProfile = { String profile ->
    File adapters = new File(repo, "compat/profiles/${profile}")
    def manifest = new JsonSlurper().parse(new File(adapters, 'manifest.json'), 'UTF-8')
    File output = new File(repo, "build/shared/${profile}/src/main")
    def expected = [] as Set
    def safePath = { File base, String path ->
        def child = new File(base, path).toPath().toAbsolutePath().normalize()
        if (!child.startsWith(base.toPath().toAbsolutePath().normalize()))
            throw new GradleException("Invalid shared-source path: ${path}")
        child.toFile()
    }
    ['java', 'resources'].each { kind ->
        File canonical = new File(repo, "common/src/main/${kind}")
        fileTree(canonical).files.sort().each { original ->
            String key = kind + '/' + canonical.toPath().relativize(original.toPath()).toString().replace('\\', '/')
            if (manifest.exclude.contains(key)) return
            String targetKey = manifest.rename[key] ?: key
            File target = safePath(output, targetKey)
            expected.add(target.canonicalPath)
            File patch = safePath(adapters, key + '.json')
            byte[] content = original.bytes
            if (patch.exists()) {
                String text = new String(content, 'UTF-8').replace('\r\n', '\n')
                content = project.applySharedChanges(text, new JsonSlurper().parse(patch, 'UTF-8').changes,
                        profile + '/' + key).getBytes('UTF-8')
            }
            if (!target.exists() || !Arrays.equals(target.bytes, content)) {
                target.parentFile.mkdirs()
                Files.write(target.toPath(), content)
            }
        }
    }
    File platform = new File(repo, "${manifest.module}/src/main")
    if (platform.exists()) fileTree(platform).files.each { original ->
        String key = platform.toPath().relativize(original.toPath()).toString().replace('\\', '/')
        if (!key.startsWith('java/') && !key.startsWith('resources/')) return
        File target = safePath(output, key)
        if (expected.contains(target.canonicalPath))
            throw new GradleException("Platform source shadows shared source: ${profile}/${key}. Use an API adapter instead.")
        expected.add(target.canonicalPath)
        if (!target.exists() || !Arrays.equals(target.bytes, original.bytes)) {
            target.parentFile.mkdirs(); Files.write(target.toPath(), original.bytes)
        }
    }
    // Only generated files beneath build/shared can be retired here.
    if (output.exists()) fileTree(output).files.each { generated ->
        if (!expected.contains(generated.canonicalPath)) Files.delete(generated.toPath())
    }
    output
}

def profiles = ['fabric-1.20.1', 'forge-1.20.1', 'mc-26.3']
if (project.hasProperty('sharedProfile')) {
    ext.sharedSourcesDir = generateSharedProfile(project.sharedProfile)
    sourceSets.main.java.setSrcDirs([new File(sharedSourcesDir, 'java')])
    sourceSets.main.resources.setSrcDirs([new File(sharedSourcesDir, 'resources')])
    def sharedTask = tasks.register('generateSharedSources') {
        inputs.dir(new File(repo, 'common/src/main'))
        inputs.dir(file('src/main'))
        inputs.dir(new File(repo, "compat/profiles/${project.sharedProfile}"))
        outputs.dir(sharedSourcesDir)
        doLast { project.generateSharedProfile(project.sharedProfile) }
    }
    tasks.named('compileJava') { dependsOn sharedTask }
    tasks.named('processResources') { dependsOn sharedTask }
    tasks.matching { it.name in ['validateAccessWidener', 'sourcesJar', 'javadoc'] }.configureEach { dependsOn sharedTask }
    def versions = new Properties()
    new File(repo, 'gradle.properties').withInputStream { versions.load(it) }
    ext.mod_version = versions.getProperty('mod_version')
} else {
    profiles.each { generateSharedProfile(it) }
    tasks.register('generateSharedSources') {
        inputs.dir(new File(repo, 'common/src/main'))
        inputs.dir(new File(repo, 'compat/profiles'))
        outputs.dir(new File(repo, 'build/shared'))
        doLast { profiles.each { project.generateSharedProfile(it) } }
    }
    tasks.register('verifySharedSources') {
        dependsOn 'generateSharedSources'
        doLast {
            assert project.applySharedChanges('one\ntwo\n', [[before:'two\n',after:'three\n']], 'fixture') == 'one\nthree\n'
            ['missing', 'one\none\n'].each { source ->
                boolean rejected = false
                try { project.applySharedChanges(source, [[before:'one\n',after:'two\n']], 'conflict fixture') }
                catch (GradleException expected) { rejected = true }
                assert rejected : 'Missing or ambiguous adapter anchors must fail closed'
            }
            profiles.each { profile ->
                def manifest = new JsonSlurper().parse(new File(repo, "compat/profiles/${profile}/manifest.json"))
                assert !manifest.exclude.any { it.startsWith('java/') } : "${profile} silently omits common Java"
                def local = new File(repo, "${manifest.module}/src/main")
                fileTree(new File(repo, 'common/src/main/java')).files.each { source ->
                    def relative = new File(repo, 'common/src/main/java').toPath().relativize(source.toPath()).toString()
                    assert !new File(local, "java/${relative}").exists() : "Edit common, not a copied source: ${profile}/${relative}"
                }
            }
        }
    }
}
